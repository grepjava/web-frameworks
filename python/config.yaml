language:
  version: 3.14

  engines:
    cheroot:
      command: ""
    tornado:
      command: ""
    twisted:
      build_deps:
        - gcc
      command: twistd --python=server.py --nodaemon
    greenlet:
      build_deps:
        - gcc
        - libev-dev
    gunicorn:
      build_deps:
        - gcc
      bootstrap:
        - pip install gunicorn
      environment:
        WORKER_CLASS: sync
        PYTHON_APP: server:app
      command: >
        gunicorn \
          --log-level critical \
          --bind 0.0.0.0:3000 \
          --reuse-port \
          --workers $(nproc) \
          --worker-class ${WORKER_CLASS} \
          ${PYTHON_APP}
    bjoern:
      build_deps:
        - gcc
        - libev-dev
    uwsgi:
      environment:
        PYTHON_APP: server:app
      build_deps:
        - gcc
        - libpcre3-dev
      bootstrap:
        - pip install uwsgi
      command: uwsgi --http 0.0.0.0:3000 --module ${PYTHON_APP}
    waitress:
      environment:
        PYTHON_APP: server:app
      bootstrap:
        - pip install waitress
      command: waitress-serve --host=0.0.0.0 --port=3000 ${PYTHON_APP}
    uvicorn:
      build_deps:
        - gcc g++
      environment:
        PYTHON_APP: server:app
      bootstrap:
        - pip install uvicorn[standard]
      command: >
        uvicorn \
          --log-level critical \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}
    hypercorn:
      build_deps:
        - gcc g++
      environment:
        PYTHON_APP: server:app
      bootstrap:
        - pip install hypercorn
      command: hypercorn --bind 0.0.0.0:3000 --workers $(nproc) ${PYTHON_APP}
    daphne:
      build_deps:
        - gcc g++
      bootstrap:
        - pip install daphne
      environment:
        PYTHON_APP: server:app
      command: daphne -b 0.0.0.0 -p 3000 ${PYTHON_APP}
    granian:
      bootstrap:
        - pip install granian
      environment:
        INTERFACE: asgi
        PYTHON_APP: server:app
      command: >
        granian \
          --log-level critical \
          --interface ${INTERFACE} \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}
    # weft (https://github.com/grepjava/weft) is a fork of granian that adds a
    # selectable native runtime backend (Tokio or Compio) and a selectable
    # Python worker model (processes or free-threaded threads). It is not yet
    # published to PyPI, so it is installed from source (a Rust toolchain is
    # required to build its native extension; pinned to a specific commit for
    # reproducibility).
    weft-tokio:
      build_deps:
        - build-essential
        - pkg-config
        - git
      bootstrap:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable && . "$HOME/.cargo/env" && pip install "weft-server @ git+https://github.com/grepjava/weft.git@07589dcdd703ab16365e69ad59ba6c8e23cd3f39"
      environment:
        INTERFACE: asgi
        RUNTIME: tokio
        PYTHON_APP: server:app
      command: >
        weft \
          --log-level critical \
          --interface ${INTERFACE} \
          --runtime ${RUNTIME} \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}
    weft-compio:
      build_deps:
        - build-essential
        - pkg-config
        - git
      bootstrap:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable && . "$HOME/.cargo/env" && pip install "weft-server @ git+https://github.com/grepjava/weft.git@07589dcdd703ab16365e69ad59ba6c8e23cd3f39"
      environment:
        INTERFACE: asgi
        RUNTIME: compio
        PYTHON_APP: server:app
      command: >
        weft \
          --log-level critical \
          --interface ${INTERFACE} \
          --runtime ${RUNTIME} \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}
    # Free-threaded variants: one process, N worker *threads* on a
    # free-threaded (--disable-gil) CPython 3.14 interpreter, installed via uv
    # into its own virtualenv (the base image's system Python is a standard
    # GIL build). Experimental in weft itself; included here as a distinct
    # comparison point, not a replacement for the process-based engines above.
    weft-tokio-ft:
      build_deps:
        - build-essential
        - pkg-config
        - git
      bootstrap:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable && curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && uv python install 3.14t && uv venv --python 3.14t /opt/venv-ft && uv pip install --python /opt/venv-ft/bin/python . "weft-server @ git+https://github.com/grepjava/weft.git@07589dcdd703ab16365e69ad59ba6c8e23cd3f39"
      environment:
        INTERFACE: asgi
        RUNTIME: tokio
        WORKER_MODE: threads
        PYTHON_APP: server:app
      command: >
        /opt/venv-ft/bin/weft \
          --log-level critical \
          --interface ${INTERFACE} \
          --runtime ${RUNTIME} \
          --python-worker-mode ${WORKER_MODE} \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}
    weft-compio-ft:
      build_deps:
        - build-essential
        - pkg-config
        - git
      bootstrap:
        - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable && curl -LsSf https://astral.sh/uv/install.sh | sh && export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH" && uv python install 3.14t && uv venv --python 3.14t /opt/venv-ft && uv pip install --python /opt/venv-ft/bin/python . "weft-server @ git+https://github.com/grepjava/weft.git@07589dcdd703ab16365e69ad59ba6c8e23cd3f39"
      environment:
        INTERFACE: asgi
        RUNTIME: compio
        WORKER_MODE: threads
        PYTHON_APP: server:app
      command: >
        /opt/venv-ft/bin/weft \
          --log-level critical \
          --interface ${INTERFACE} \
          --runtime ${RUNTIME} \
          --python-worker-mode ${WORKER_MODE} \
          --host 0.0.0.0 \
          --port 3000 \
          --workers $(nproc) \
          ${PYTHON_APP}

framework:
  engines:
    - gunicorn
  build_deps:
    - build-essential
  files:
    - "**/*.py"
    - pyproject.toml
